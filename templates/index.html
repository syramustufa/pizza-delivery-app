<!DOCTYPE html>
<html>
<body>
<h2>Login</h2>
<form method="post" action="/login">
  <input name="username" placeholder="username">
  <input name="password" placeholder="password" type="password">
  <button>Login</button>
</form>
</body>
</html>
<!DOCTYPE html>
<html>
<head>
  <script src="/static/app.js"></script>
</head>
<body>

<h1>🍕 Pizza Delivery App</h1>

<h2>Add Pizza</h2>
<form action="/pizza" method="post">
  <input name="name" placeholder="Pizza name" required>
  <input name="price" type="number" placeholder="Price" required>
  <input name="quantity" type="number" placeholder="Quantity" required>
  <button>Add</button>
</form>

<h2>Menu</h2>
<ul>
{% for name, p in pizzas.items() %}
  <li>
    {{ name }} — ${{ p.price }} — Qty: {{ p.quantity }}
    <button onclick="orderPizza('{{ name }}')">Order</button>
    <button onclick="deletePizza('{{ name }}')">Delete</button>
  </li>
{% endfor %}
</ul>

<h2>Orders</h2>
<ul>
{% for o in orders %}
  <li>{{ o.pizza }} x {{ o.qty }}</li>
{% endfor %}
</ul>

</body>
</html>
